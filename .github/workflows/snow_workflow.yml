name: Security Incident Automation Platform

on:
  workflow_dispatch:

env:
  TF_VAR_servicenow_username: ${{ secrets.SERVICENOW_USERNAME }}
  TF_VAR_servicenow_password: ${{ secrets.SERVICENOW_PASSWORD }}
  TF_VAR_servicenow_instance_url: ${{ secrets.SERVICENOW_INSTANCE_URL }}

jobs:

  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false


  init:
    name: Terraform Init
    needs: checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        env:
          SUPABASE_DB_URL: ${{ secrets.PG_CONN_STR }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="conn_str=${SUPABASE_DB_URL}"

  plan:
    name: Terraform Plan
    needs: init
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        env:
          SUPABASE_DB_URL: ${{ secrets.PG_CONN_STR }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="conn_str=${SUPABASE_DB_URL}"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan


  review:
    name: Terraform Review
    needs: plan
    runs-on: ubuntu-latest

    environment:
      name: terraform-review

    steps:
      - name: Review Terraform Plan
        run: |
          echo "Terraform plan has been generated."
          echo "Review the Terraform plan artifact before approving Apply."


  apply:
    name: Terraform Apply
    needs: review
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        env:
          SUPABASE_DB_URL: ${{ secrets.PG_CONN_STR }}
        run: |
          terraform init \
            -reconfigure \
            -backend-config="conn_str=${SUPABASE_DB_URL}"

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

